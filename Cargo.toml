[package]
name = "mouse-gesture"
version = "0.1.0"
edition = "2021"
description = "Fast, lightweight Windows mouse gesture daemon"

[dependencies]
windows = { version = "0.62", features = [
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_HiDpi",
    "Win32_Storage_FileSystem",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_System_RemoteDesktop",
    "Win32_Graphics_Gdi",
    "Win32_Foundation",
    "Win32_System_Registry",
    "Win32_System_Console",
]}
toml = "0.8"
log = "0.4"
env_logger = "0.11"
anyhow = "1"

[dev-dependencies]
proptest = "1"

[profile.release]
opt-level = 2
lto = true
codegen-units = 1
strip = "symbols"
panic = "unwind"
