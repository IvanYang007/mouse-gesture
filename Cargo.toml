[package]
name = "mouse-gesture"
version = "0.1.0"
edition = "2021"
description = "Fast, lightweight Windows mouse gesture daemon"

[lib]
name = "mouse_gesture"
path = "src/lib.rs"

[dependencies]
windows = { version = "0.62", features = [
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_Storage_FileSystem",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_System_RemoteDesktop",
    "Win32_System_SystemServices",
    "Win32_Graphics_Gdi",
    "Win32_Foundation",
]}
serde = { version = "1", features = ["derive"] }
toml = "0.8"
toml_edit = "0.22"
log = { version = "0.4", features = ["std"] }
anyhow = "1"

[dev-dependencies]
proptest = "1"

[profile.release]
opt-level = 2
lto = true
codegen-units = 1
strip = true
panic = "abort"
